syntax = "proto3";

package resonate; 

option go_package = "github.com/dghwood/resonate/proto";

enum ErrorEnum {
    ERROR_UNKNOWN = 0; 
    ERROR_INTERNAL = 1; 
    ERROR_PERMISSION_DENIED = 2;
    ERROR_INVALID_CREDENTIALS = 3;
    ERROR_TOO_MANY_ATTEMPTS = 4;
    ERROR_TIME_EXPIRED = 5;
    ERROR_UPLOAD_SIZE_EXCEEDED = 6;
}
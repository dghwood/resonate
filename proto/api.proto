syntax = "proto3";

package resonate.api; 

import "proto/common.proto";

option go_package = "github.com/dghwood/resonate/proto";

message ResponseInfo {
    bool success = 1; 
    string error_message = 2; 
}
message RequestInfo {
    string user_id = 1; 
    TokenMessage access_token = 2; 
}

// Used to refresh access tokens
message RefreshAuthMessage {
    message Request {
        RequestInfo request_info = 1; 
        TokenMessage refresh_token = 2; 
    }
    message Response {
        ResponseInfo response_info = 1;
        TokenMessage access_token = 2; 
    }
    Request request = 1;
    Response response = 2;
}

// Used to request login password 
message LoginRequestMessage {
    message Request {
        RequestInfo request_info = 1; 
        string email = 2; 
    }
    message Response {
        ResponseInfo response_info = 1;
    }
    Request request = 1;
    Response response = 2;
}

message LoginUserMessage {
    message Request {
        RequestInfo request_info = 1; 
        string email = 2; 
        string password = 3; 
    }
    message Response {
        ResponseInfo response_info = 1;
        TokenMessage access_token = 2; 
        TokenMessage refresh_token = 3;
        UserMessage user = 4; 
    }
    Request request = 1;
    Response response = 2;
}

message CreateUserMessage {
    message Request {
        RequestInfo request_info = 1; 
        UserMessage user = 2; 
    }
    message Response {
        ResponseInfo response_info = 1;
        UserMessage user = 2;
    }
    Request request = 1;
    Response response = 2;
}

message GetUserMessage {
    message Request {
        RequestInfo request_info = 1; 
        string user_id = 2; 
    }
    message Response {
        ResponseInfo response_info = 1;
        UserMessage user = 2; 
    }
    Request request = 1;
    Response response = 2;
}

message UpdateUserMessage {
    message Request {
        RequestInfo request_info = 1; 
        UserMessage user = 2; 
    }
    message Response {
        ResponseInfo response_info = 1;
        UserMessage user = 2; 
    }
    Request request = 1;
    Response response = 2;
}

message SearchMessage {
    message Request {
        RequestInfo request_info = 1; 
        string query = 2; 
    }
    message Response {
        ResponseInfo response_info = 1;
        repeated PodcastMessage podcasts = 2; 
        repeated UserMessage users = 3; 
        repeated EpisodeMessage episodes = 4;
    }
    Request request = 1;
    Response response = 2;
}

message GetPodcastMessage {
    message Request {
        RequestInfo request_info = 1; 
        string podcast_id = 2; 
    }
    message Response {
        ResponseInfo response_info = 1;
        PodcastMessage podcast = 2; 
    }
    Request request = 1;
    Response response = 2;
}

message GetEpisodeMessage {
    message Request {
        RequestInfo request_info = 1; 
        string episode_id = 2; 
    }
    message Response {
        ResponseInfo response_info = 1;
        EpisodeMessage episode = 2; 
    }
    Request request = 1;
    Response response = 2;
}

message AddSubscriptionMessage {
    message Request {
        RequestInfo request_info = 1; 
        UserSubscriptionMessage subscription = 2; 
    }
    message Response {
        ResponseInfo response_info = 1;
        UserSubscriptionMessage subscription = 2; 
    }
    Request request = 1;
    Response response = 2;
}
message RemoveSubscriptionMessage {
    message Request {
        RequestInfo request_info = 1; 
        UserSubscriptionMessage subscription = 2; 
    }
    message Response {
        ResponseInfo response_info = 1;
        UserSubscriptionMessage subscription = 2; 
    }
    Request request = 1;
    Response response = 2;
}

